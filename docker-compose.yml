version: '3.8'

services:
  api:
    build: .
    container_name: scadova_ai_india_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/scadova_india
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/scadova_india
      - JWT_SECRET_KEY=change-this-to-a-super-secret-key-at-least-32-chars-long
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    container_name: scadova_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=scadova_india
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
